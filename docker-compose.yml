services:
  agrod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/agrod.db
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - agrod_data:/app/data

volumes:
  agrod_data:
